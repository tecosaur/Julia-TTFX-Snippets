name: Close stale failed TTFX tasks

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close failed task issues inactive for 3 days
        uses: actions/github-script@v7
        with:
          script: |
            const staleMs = 3 * 24 * 60 * 60 * 1000;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: '🛠 newtask,failed'
            });
            for (const issue of issues) {
              if (issue.pull_request || Date.now() - Date.parse(issue.updated_at) < staleMs) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Closing after 3 days of inactivity. Editing the task code will still re-run it."
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
              core.info(`Closed stale failed task #${issue.number}`);
            }
