name: Create TTFX snippet PR

on:
  issues:
    types: [labeled, edited]

permissions: {}

jobs:
  # Runs the submitted code (sandboxed), so it can only write issue comments,
  # for the live progress report. Everything it produces is checked by `publish`.
  build:
    # Issue forms apply their labels as a `labeled` event, so this covers new
    # submissions and manual labelling; body edits re-run failed submissions.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == '🛠 newtask') ||
      (github.event.action == 'edited' && github.event.changes.body &&
       contains(github.event.issue.labels.*.name, '🛠 newtask') &&
       contains(github.event.issue.labels.*.name, 'failed'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    outputs:
      outcome: ${{ steps.gensnippet.outcome }}
      task_dir: ${{ steps.gensnippet.outputs.task_dir }}
      time_install: ${{ steps.gensnippet.outputs.task_time_install }}
      time_using: ${{ steps.gensnippet.outputs.task_time_using }}
      time_script: ${{ steps.gensnippet.outputs.task_time_script }}
      time_total: ${{ steps.gensnippet.outputs.task_time_total }}

    steps:
      - name: Label issue as running
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['⚙️ running']
            });
            if (context.payload.issue.labels.some(l => l.name === 'failed')) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: 'failed'
              });
            }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parse issue form fields
        id: parser
        uses: actions/github-script@v9
        with:
          script: |
            const { parseIssueForm } = require('./.github/scripts/ttfx.js');
            for (const [key, value] of Object.entries(parseIssueForm(context.payload.issue.body))) {
              core.setOutput(key, value);
            }

      # Further versions are installed as needed by create-snippet.jl
      - name: Install Julia
        uses: julia-actions/install-juliaup@v3
        with:
          channel: release

      - name: Set up sandbox
        run: |
          # Ubuntu stops unprivileged user namespaces mounting anything, which bubblewrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get install -y -qq bubblewrap

      - name: Run create-snippet.jl
        id: gensnippet
        continue-on-error: true
        env:
          # Julia 1.0–1.7 can't read compressed registries, failing to resolve anything
          JULIA_PKG_UNPACK_REGISTRY: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
          SNIPPET_NAME: ${{ steps.parser.outputs.task_name }}
          SNIPPET_PACKAGE: ${{ steps.parser.outputs.primary_package }}
          SNIPPET_DEPS: ${{ steps.parser.outputs.dependencies }}
          SNIPPET_AUTHOR: ${{ github.event.issue.user.login }}
          SNIPPET_ATTRIBUTION: ${{ steps.parser.outputs.attribution }}
          SNIPPET_TASK_CODE: ${{ steps.parser.outputs.task_code }}
        run: |
          set -euo pipefail
          julia create-snippet.jl \
            --name "$SNIPPET_NAME" \
            --package "$SNIPPET_PACKAGE" \
            --deps "$SNIPPET_DEPS" \
            --author "$SNIPPET_AUTHOR" \
            --attribution "$SNIPPET_ATTRIBUTION" \
            --snippet "$SNIPPET_TASK_CODE" \
            2>&1 | tee create-snippet-logs.txt

      - name: Stage results
        if: always()
        env:
          OUTCOME: ${{ steps.gensnippet.outcome }}
          TASK_DIR: ${{ steps.gensnippet.outputs.task_dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/result/task"
          if [ -f create-snippet-logs.txt ]; then cp create-snippet-logs.txt "$RUNNER_TEMP/result/"; fi
          if [ "$OUTCOME" = success ]; then cp "$TASK_DIR/task.jl" "$TASK_DIR/Project.toml" "$RUNNER_TEMP/result/task/"; fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result
          path: ${{ runner.temp }}/result
          retention-days: 1

  # Never runs submitted code, and is the only job that can change the repository.
  publish:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Download build results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: result
          path: ${{ runner.temp }}/result

      - name: Check build results
        id: task
        if: needs.build.outputs.outcome == 'success' && steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          TASK_DIR: ${{ needs.build.outputs.task_dir }}
          TIME_INSTALL: ${{ needs.build.outputs.time_install }}
          TIME_USING: ${{ needs.build.outputs.time_using }}
          TIME_SCRIPT: ${{ needs.build.outputs.time_script }}
          TIME_TOTAL: ${{ needs.build.outputs.time_total }}
        with:
          script: |
            const ttfx = require('./.github/scripts/ttfx.js');
            const form = ttfx.parseIssueForm(context.payload.issue.body);
            let task;
            try {
              task = ttfx.prepareTask({
                stagedDir: `${process.env.RUNNER_TEMP}/result/task`,
                workspace: process.env.GITHUB_WORKSPACE,
                taskDir: process.env.TASK_DIR,
                pkg: form.primary_package,
                submitter: context.payload.issue.user.login,
                timings: {
                  install: process.env.TIME_INSTALL, using: process.env.TIME_USING,
                  script: process.env.TIME_SCRIPT, total: process.env.TIME_TOTAL,
                },
              });
            } catch (err) {
              if (!(err instanceof ttfx.InvalidResult)) throw err;
              core.setOutput('rejection', err.message);
              core.setFailed(err.message);
              return;
            }
            const repo = await ttfx.registryRepo(form.primary_package).catch(err => {
              core.warning(`Couldn't look up the repository of ${form.primary_package}: ${err.message}`);
              return null;
            });
            for (const [key, value] of Object.entries({
              package: form.primary_package, name: form.task_name,
              nature: task.nature, authorship: task.authorship, pkg_owner: repo?.owner ?? '',
              time_install: task.timings.install, time_using: task.timings.using,
              time_script: task.timings.script, time_total: task.timings.total,
            })) {
              core.setOutput(key, value);
            }

      - name: Create Pull Request
        id: create_pr
        if: steps.task.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: ${{ github.event.issue.user.login }} <${{ github.event.issue.user.login }}@users.noreply.github.com>
          committer: GitHub Actions <actions@github.com>
          commit-message: |
            ${{ steps.task.outputs.nature }}: ${{ steps.task.outputs.package }}, ${{ steps.task.outputs.name }}
          branch: ttfx-snippet-${{ github.event.issue.number }}
          title: "${{ steps.task.outputs.nature }}: ${{ steps.task.outputs.package }}, ${{ steps.task.outputs.name }}"
          body: |
            ### Task summary
            **Package:** ${{ steps.task.outputs.package }} (by ${{ steps.task.outputs.pkg_owner }})
            **Task:** ${{ steps.task.outputs.name }}
            **Submitted by:** @${{ github.event.issue.user.login }}

            ### Task timings
            - Installation time: `${{ steps.task.outputs.time_install }}`s
            - Package loading: `${{ steps.task.outputs.time_using }}`s
            - Task script: `${{ steps.task.outputs.time_script }}`s
            - Total time: `${{ steps.task.outputs.time_total }}`s

            ###### Closes #${{ github.event.issue.number }}
          labels: 🤖 automated-ttfx-snippet
          base: main

      - name: Auto-merge trusted submissions
        if: steps.task.outcome == 'success'
        uses: actions/github-script@v9
        env:
          AUTHORSHIP: ${{ steps.task.outputs.authorship }}
          PKG_OWNER: ${{ steps.task.outputs.pkg_owner }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        with:
          script: |
            const { automergeReason } = require('./.github/scripts/ttfx.js');
            const submitter = context.payload.issue.user.login;
            const reason = await automergeReason({
              authorship: process.env.AUTHORSHIP,
              submitter,
              pkgOwner: process.env.PKG_OWNER,
              // 404 for non-members, private members, and non-org accounts
              isPublicMember: async org => {
                try {
                  await github.rest.orgs.checkPublicMembershipForUser({ org, username: submitter });
                  return true;
                } catch (e) {
                  if (e.status === 404) return false;
                  throw e;
                }
              },
            });
            if (!reason) {
              console.log(`${submitter} is not a task author, package maintainer, or JuliaLang member; skipping automerge.`);
              return;
            }
            console.log(`Issue author ${submitter} is ${reason}; auto-merging.`);

            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
              labels: ['automerge']
            });
            console.log("Added `automerge` label to PR #" + prNumber);

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: prNumber
            });
            const msg = `\n\n⚙️ **Auto-merge**: The submitter, @${submitter}, is ${reason}.`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: prNumber,
              body: pr.body + msg
            });

            console.log("Merged #" + prNumber);
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: prNumber,
              merge_method: 'rebase'
            });

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `heads/${pr.head.ref}`
            });
            console.log(`Deleted branch \`${pr.head.ref}\`.`);

      - name: Remove running label from issue
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: '⚙️ running'
              });
            } catch (e) {
              /* ignore if already removed */
            }

      - name: Handle failure
        if: needs.build.outputs.outcome == 'failure' || steps.task.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          REJECTION: ${{ steps.task.outputs.rejection }}
        with:
          script: |
            const fs = require('fs');
            const { fencedLog } = require('./.github/scripts/ttfx.js');
            const logfile = `${process.env.RUNNER_TEMP}/result/create-snippet-logs.txt`;
            const details = process.env.REJECTION
              ? "⚠️ The task ran, but its results were rejected:\n\n" + fencedLog(process.env.REJECTION)
              : "⚠️ `create-snippet.jl` failed. Logs (look for an error at the end):\n\n" +
                fencedLog(fs.existsSync(logfile) ? fs.readFileSync(logfile, 'utf8') : '(no logs were produced)');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: details +
                "\n\nIf you can resolve the error, edit this issue with the corrected code and it will be re-run. " +
                "Failed issues are closed after 3 days of inactivity."
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['failed']
            });

      - name: Close issue
        if: always() && needs.build.outputs.outcome != 'failure' && steps.task.outcome != 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });
