[deps]
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"

[compat]
CairoMakie = ">=0.7.5"
julia = "1.3.0"

# TEMPORARY: released Makie (v0.24.13) fails to precompile on Julia 1.14 (nightly) because its
# tick formatter passes a negative precision to `Base.Ryu.writefixed`, which JuliaLang/julia#62797
# turned into an error. Fixed on Makie master by MakieOrg/Makie.jl#5752 (df35eae463); pin both
# monorepo packages to that commit. Remove once a Makie release includes it. `[sources]` needs
# Pkg 1.11+, so Julia 1.10 silently resolves the registered releases instead.
[sources]
Makie = {url = "https://github.com/MakieOrg/Makie.jl", rev = "df35eae463", subdir = "Makie"}
CairoMakie = {url = "https://github.com/MakieOrg/Makie.jl", rev = "df35eae463", subdir = "CairoMakie"}
